{% load static %}

<!-- ===== WIDGET FLOTANTE DE CHATBOT (global, en todas las páginas) ===== -->
<div id="cys-chatbot-widget" hx-preserve="true">
  <!-- Botón flotante de acceso con la imagen del personaje -->
  <button
    type="button"
    class="cys-chatbot-toggle"
    id="cysChatbotToggle"
    onclick="aydAbrirChatbot()"
    title="Asistente Virtual CYS"
    aria-label="Abrir asistente virtual chatbot"
  >
    <img
      src="{% static 'img/muñeco_sin_fondo_.png' %}"
      alt="Asistente Virtual CYS"
      class="cys-chatbot-toggle__img"
    />
    <span class="cys-chatbot-toggle__badge" title="En línea"></span>
    <span class="cys-chatbot-toggle__tooltip">¿Necesitas ayuda? 💬</span>
  </button>

  <!-- Modal Chatbot Interactiva (Pantalla para iniciar la conversación) -->
  <div
    class="modal fade ayd-chat-modal"
    id="modalChatbotAyuda"
    tabindex="-1"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <!-- Header del Chat -->
        <div class="ayd-chat-header">
          <div class="d-flex align-items-center gap-3">
            <div class="ayd-chat-avatar">
              <img
                src="{% static 'img/muñeco_sin_fondo_.png' %}"
                alt="Asistente CYS"
              />
            </div>
            <div>
              <h6 class="fw-bold text-white mb-0 d-flex align-items-center gap-2">
                Asistente Virtual CYS
                <span
                  class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-40 rounded-pill px-2 py-0.5"
                  style="font-size:0.68rem;"
                >
                  🟢 En línea
                </span>
              </h6>
              <small style="color:#a0aec0; font-size:0.75rem;">
                Respuesta inmediata a tus dudas del sistema
              </small>
            </div>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button
              type="button"
              class="btn btn-sm text-white-50 p-1"
              onclick="aydLimpiarChat()"
              title="Reiniciar Chat"
            >
              <i class="bi bi-arrow-counterclockwise fs-5"></i>
            </button>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
        </div>

        <!-- Cuerpo del Chat -->
        <div class="ayd-chat-body" id="ayd-chat-messages">
          <!-- Mensaje de Bienvenida -->
          <div class="ayd-msg ayd-msg-bot">
            <div class="ayd-chat-avatar">
              <img
                src="{% static 'img/muñeco_sin_fondo_.png' %}"
                alt="Asistente CYS"
              />
            </div>
            <div class="ayd-msg-bubble">
              <strong>👋 ¡Hola! Soy tu Asistente Virtual CYS.</strong><br />
              ¿En qué te puedo ayudar hoy? Puedes escribir tu duda o seleccionar una de las sugerencias rápidas:

              <div class="d-flex flex-wrap gap-1.5 mt-2.5">
                <button
                  type="button"
                  class="ayd-chip-btn"
                  onclick="aydAgregarMensaje('¿Cómo registrar una venta?', 'user'); aydSimularRespuestaBot(BOT_KNOWLEDGE[0].respuesta);"
                >
                  🛒 Registrar Venta
                </button>
                <button
                  type="button"
                  class="ayd-chip-btn"
                  onclick="aydAgregarMensaje('¿Cómo hacer una devolución?', 'user'); aydSimularRespuestaBot(BOT_KNOWLEDGE[1].respuesta);"
                >
                  🔄 Hacer Devolución
                </button>
                <button
                  type="button"
                  class="ayd-chip-btn"
                  onclick="aydAgregarMensaje('¿Cómo abrir o cerrar caja?', 'user'); aydSimularRespuestaBot(BOT_KNOWLEDGE[2].respuesta);"
                >
                  💰 Apertura y Cierre de Caja
                </button>
                <button
                  type="button"
                  class="ayd-chip-btn"
                  onclick="aydAgregarMensaje('¿Cómo consultar stock?', 'user'); aydSimularRespuestaBot(BOT_KNOWLEDGE[4].respuesta);"
                >
                  📦 Consultar Stock
                </button>
                <button
                  type="button"
                  class="ayd-chip-btn"
                  onclick="aydAgregarMensaje('¿Cómo ver métodos de pago?', 'user'); aydSimularRespuestaBot(BOT_KNOWLEDGE[3].respuesta);"
                >
                  💳 Métodos de Pago
                </button>
                <button
                  type="button"
                  class="ayd-chip-btn"
                  onclick="aydAgregarMensaje('¿Cómo crear compras?', 'user'); aydSimularRespuestaBot(BOT_KNOWLEDGE[5].respuesta);"
                >
                  🚚 Compras a Proveedores
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer / Formulario del Chat -->
        <div class="ayd-chat-footer">
          <form
            id="ayd-chat-form"
            onsubmit="aydEnviarMensajeChat(event)"
            class="d-flex gap-0"
          >
            <input
              type="text"
              id="ayd-chat-input-text"
              class="form-control ayd-chat-input"
              placeholder="Escribe tu duda aquí (ej: 'cómo hacer una devolución', 'stock', 'caja')..."
              autocomplete="off"
              required
            />
            <button
              type="submit"
              class="btn ayd-chat-send-btn d-flex align-items-center gap-1"
            >
              <i class="bi bi-send-fill"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
